<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Calculator Suite</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- Background Overlay -->
<div class="background-overlay"></div>

<!-- Navigation Tabs -->
<nav class="tab-navigation">
    <ul>
        <li class="tab active" data-tab="investment">Investment Calculator</li>
        <li class="tab" data-tab="loan">Loan Calculator</li>
        <li class="tab" data-tab="mortgage">Mortgage Calculator</li>
        <li class="tab" data-tab="tax">Income Tax Calculator</li>
    </ul>
</nav>

<!-- Main Content -->
<div class="container">
    <!-- Investment Calculator (Default Visible Tab) -->
    <div id="investment" class="tab-content active">
        <div class="form-container">
            <h1>Investment Calculator</h1>
            <form id="investment-form">
                <div class="form-group">
                    <label for="initial">Initial Deposit ($):</label>
                    <input type="number" id="initial" name="initial" min="0" value="0" required>
                </div>

                <div class="form-group">
                    <label for="amount">Periodic Investment Amount ($):</label>
                    <input type="number" id="amount" name="amount" min="1" required>
                </div>

                <div class="form-group">
                    <label for="frequency">Investment Frequency:</label>
                    <select id="frequency" name="frequency" required>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="timeline">Investment Timeline (years):</label>
                    <input type="number" id="timeline" name="timeline" min="1" required>
                </div>

                <div class="form-group">
                    <label for="contributionTiming">Contribution Timing:</label>
                    <select id="contributionTiming" name="contributionTiming" required>
                        <option value="beginning">Beginning of Period</option>
                        <option value="end">End of Period</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="investmentType">Investment Type:</label>
                    <select id="investmentType" name="investmentType" required>
                        <option value="index">Index (S&P 500, QQQ, Magnificent 7)</option>
                        <option value="custom">Custom Stock Pie</option>
                    </select>
                </div>

                <!-- Index selection -->
                <div id="indexSection" class="form-group">
                    <label for="index">Choose Index:</label>
                    <select id="index" name="index">
                        <option value="sp500">S&P 500 (Avg 10%)</option>
                        <option value="qqq">QQQ (Avg 12%)</option>
                        <option value="magnificent7">Magnificent 7 (Est. 15%)</option>
                    </select>
                </div>

                <!-- Custom Pie Section -->
                <div id="customPieSection" class="hidden">
                    <h3>Build Your Stock Pie</h3>
                    <div id="pieBuilder"></div>
                    <button type="button" id="addStockBtn">Add Stock</button>
                    <p><em>Note: Assuming 20% return for pie until real data is connected.</em></p>
                </div>

                <!-- Sign-Up Prompt -->
                <!-- <div id="signupSection" class="hidden">
                    <h3>Sign Up to Save Your Portfolio</h3>
                    <div class="form-group">
                        <label for="name">First Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="surname">Last Name:</label>
                        <input type="text" id="surname" name="surname" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div> -->

                <button type="submit">Calculate</button>
                <div id="result" class="result"></div>
            </form>
        </div>
        <div class="chart-container">
            <canvas id="investmentChart"></canvas>
            <canvas id="pieChart"></canvas>
            <canvas id="buyHoldChart"></canvas>
        </div>
    </div>
    <!-- Loan Calculator -->
    <div id="loan" class="tab-content hidden">
        <div class="form-container">
            <h1>Loan Calculator</h1>
            <form id="loan-form">
                <div class="form-group">
                    <label for="loanAmount">Loan Amount ($):</label>
                    <input type="number" id="loanAmount" min="1" value="10000" required>
                </div>
                <div class="form-group">
                    <label for="loanRate">Annual Interest Rate (%):</label>
                    <input type="number" id="loanRate" min="0.01" step="0.01" value="6.5" required>
                </div>
                <div class="form-group">
                    <label for="loanTerm">Loan Term (years):</label>
                    <input type="number" id="loanTerm" min="1" value="5" required>
                </div>
                <div class="form-group">
                    <label for="loanType">Loan Type:</label>
                    <select id="loanType">
                        <option value="amortized">Amortized (Fixed Monthly)</option>
                        <option value="interestOnly">Interest Only</option>
                        <option value="bulletLoan">Bullet Loan (Lump Sum at End)</option>
                    </select>
                </div>
                <button type="submit">Calculate</button>
                <div id="loanResult" class="result"></div>
            </form>
        </div>
        <div class="chart-container">
            <canvas id="loanAmortChart"></canvas>
            <canvas id="loanBreakdownChart"></canvas>
        </div>
    </div>

    <!-- Mortgage Calculator -->
    <div id="mortgage" class="tab-content hidden">
        <div class="form-container">
            <h1>Mortgage Calculator</h1>
            <form id="mortgage-form">
                <div class="form-group">
                    <label for="homePrice">Home Price ($):</label>
                    <input type="number" id="homePrice" min="1" value="400000" required>
                </div>
                <div class="form-group">
                    <label for="downPayment">Down Payment ($):</label>
                    <input type="number" id="downPayment" min="0" value="80000" required>
                </div>
                <div class="form-group">
                    <label for="mortgageRate">Annual Interest Rate (%):</label>
                    <input type="number" id="mortgageRate" min="0.01" step="0.01" value="7.0" required>
                </div>
                <div class="form-group">
                    <label for="mortgageTerm">Loan Term (years):</label>
                    <select id="mortgageTerm">
                        <option value="30">30 Years</option>
                        <option value="20">20 Years</option>
                        <option value="15">15 Years</option>
                        <option value="10">10 Years</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="propertyTax">Annual Property Tax ($):</label>
                    <input type="number" id="propertyTax" min="0" value="4800">
                </div>
                <div class="form-group">
                    <label for="homeInsurance">Annual Home Insurance ($):</label>
                    <input type="number" id="homeInsurance" min="0" value="1200">
                </div>
                <div class="form-group">
                    <label for="pmi">Monthly PMI ($) <em style="font-weight:normal;color:#888;">(if &lt;20% down)</em>:</label>
                    <input type="number" id="pmi" min="0" value="0">
                </div>
                <button type="submit">Calculate</button>
                <div id="mortgageResult" class="result"></div>
            </form>
        </div>
        <div class="chart-container">
            <canvas id="mortgageAmortChart"></canvas>
            <canvas id="mortgageBreakdownChart"></canvas>
        </div>
    </div>

    <!-- Income Tax Calculator -->
    <div id="tax" class="tab-content hidden">
        <div class="form-container">
            <h1>Income Tax Calculator</h1>
            <form id="tax-form">
                <div class="form-group">
                    <label for="grossIncome">Annual Gross Income ($):</label>
                    <input type="number" id="grossIncome" min="0" value="75000" required>
                </div>
                <div class="form-group">
                    <label for="filingStatus">Filing Status:</label>
                    <select id="filingStatus">
                        <option value="single">Single</option>
                        <option value="marriedJoint">Married Filing Jointly</option>
                        <option value="marriedSeparate">Married Filing Separately</option>
                        <option value="headOfHousehold">Head of Household</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="deductionType">Deduction Type:</label>
                    <select id="deductionType">
                        <option value="standard">Standard Deduction</option>
                        <option value="itemized">Itemized Deduction</option>
                    </select>
                </div>
                <div id="itemizedSection" class="hidden">
                    <div class="form-group">
                        <label for="itemizedAmount">Total Itemized Deductions ($):</label>
                        <input type="number" id="itemizedAmount" min="0" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label for="otherIncome">Other Income (dividends, freelance, etc.) ($):</label>
                    <input type="number" id="otherIncome" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="preTaxDeductions">Pre-Tax Deductions (401k, HSA, etc.) ($):</label>
                    <input type="number" id="preTaxDeductions" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="taxYear">Tax Year:</label>
                    <select id="taxYear">
                        <option value="2024">2024</option>
                        <option value="2023">2023</option>
                    </select>
                </div>
                <button type="submit">Calculate</button>
                <div id="taxResult" class="result"></div>
            </form>
        </div>
        <div class="chart-container">
            <canvas id="taxBreakdownChart"></canvas>
            <canvas id="taxBracketsChart"></canvas>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
